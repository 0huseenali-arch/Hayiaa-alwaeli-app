<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>هيئة الشيخ أحمد الوائلي</title>
    <meta name="description" content="تطبيق ثقافي توعوي لهيئة الشيخ أحمد الوائلي رحمه الله — القرآن الكريم، الأدعية والزيارات، التقويم الهجري، ومنشورات الهيئة." />
    <meta name="theme-color" content="#0A1310" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:title" content="هيئة الشيخ أحمد الوائلي" />
    <meta property="og:description" content="تطبيق ثقافي توعوي — القرآن الكريم، الأدعية والزيارات، التقويم الهجري، ومنشورات الهيئة." />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:type" content="website" />

    <!-- OneSignal Web Push SDK -->
    <!-- ملاحظة: نستخدم نفس sw.js الموجود (المدمج بكود OneSignal بداخله)
         بدل ملف OneSignalSDKWorker.js منفصل، لتفادي تعارض تسجيل
         Service Worker على نفس النطاق (scope) مع السيرفس وركر الأساسي للتطبيق. -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function (OneSignal) {
        await OneSignal.init({
          appId: "601cac8e-baf6-40d1-ba32-75fef5f02281",
          serviceWorkerParam: { scope: "/" },
          serviceWorkerPath: "sw.js",
        });
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // تسجيل Service Worker لتفعيل العمل بدون إنترنت
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch((err) => {
            console.warn("تعذّر تسجيل Service Worker:", err);
          });
        });
      }
    </script>
  </body>
</html>
